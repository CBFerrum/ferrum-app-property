- name: PropertySettings
  label: Property Settings
  kind: settings
  module: property
  description: "Where rent is invoiced from, what a late payment costs, and where deposits are held."
  fields:
    - {name: company, type: link, to: Company, required: true}
    - {name: rent_item, type: link, to: Item, required: true, description: "What rent is invoiced as"}
    - {name: late_fee_item, type: link, to: Item, description: "What a late fee is invoiced as; without one, there are no late fees"}
    - {name: late_fee_after_days, type: int, default: 7, min: 0, label: Late After (Days), description: "Days past an issued rent invoice's due day before a fee is charged"}
    - {name: late_fee_amount, type: currency, min: "0", description: "A fixed fee"}
    - {name: late_fee_percent, type: percent, min: "0", max: "100", description: "And a share of what is still owed"}
    - {name: deposit_account, type: link, to: Account, link_filters: {is_group: false, root_type: Liability}, description: "Where deposits are held; without one, a deposit is only recorded on the lease"}
    - {name: deposit_deductions_account, type: link, to: Account, link_filters: {is_group: false, root_type: Income}, label: Deposit Deductions Account, description: "Where what is kept of a deposit goes"}
    - {name: service_charge_item, type: link, to: Item, description: "What service charges are invoiced as; without one, none are"}
    - {name: owner_payout_item, type: link, to: Item, label: Owner Payout Item, description: "What an owner's statement is billed as, by the owner to the company, for their share"}
  form:
    - {label: Books, fields: [company, rent_item]}
    - {label: Late Payment, fields: [late_fee_item, late_fee_after_days, late_fee_amount, late_fee_percent]}
    - {label: Deposits, fields: [deposit_account, deposit_deductions_account]}
    - {label: Service Charges, fields: [service_charge_item]}
    - {label: Owners, fields: [owner_payout_item]}

- name: Building
  label: Property
  label_plural: Properties
  kind: master
  module: property
  title_field: building_name
  fields:
    - {name: building_name, type: data, required: true, in_list: true}
    - {name: address, type: text}
    - {name: manager_email, type: email, label: Manager}
    - {name: owner_email, type: email, label: Owner, in_filter: true, description: "Who owns it: once they are a portal person with this address (Administration, Users), signed in to the portal they see its units, leases, rent invoiced and still owed, repairs and statements under Properties You Own"}
    - {name: owner_supplier, type: link, to: Supplier, label: Owner In The Books, description: "The owner as ERP's supplier: their statements' payouts are billed by them"}
    - {name: management_fee_percent, type: percent, default: 0, min: "0", max: "100", label: Management Fee %, description: "The share of the rent collected the company keeps for managing it"}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {is_group: false}, label: Owner's Costs In The Books, description: "Bills in ERP charged to it (their lines' cost center), once submitted, are expenses on the owner's statements"}
  list: {columns: [building_name, owner_email, manager_email], sort: building_name asc}

- name: Unit
  label: Unit
  label_plural: Units
  kind: master
  module: property
  title_field: unit_number
  fields:
    - {name: unit_number, type: data, required: true, in_list: true}
    - {name: building, type: link, to: Building, required: true, in_list: true, in_filter: true}
    - {name: unit_type, type: select, options: [Residential, Office, Retail, Industrial, Parking, Storage], default: Residential, in_list: true, in_filter: true}
    - {name: area, type: decimal, label: Area (sq m), in_list: true}
    - {name: weighting, type: decimal, default: 1, min: "0", description: "Its weight when a building's service charge is shared by weighted area: a shop on the street may bear more than its floor area"}
    - {name: status, type: select, options: [Vacant, Let, Under Maintenance], default: Vacant, read_only: true, no_copy: true, in_list: true, in_filter: true}
  list: {columns: [unit_number, building, unit_type, area, status], sort: unit_number asc}

- name: Lease
  label: Lease
  label_plural: Leases
  kind: master
  module: property
  title_field: unit
  description: A unit let to a tenant for a term. Active, it is invoiced each period through ERP, a period cut short for its days, at the rent in effect when it starts; a unit has one active lease at a time. Notice given ends it once the notice runs out.
  fields:
    - {name: unit, type: link, to: Unit, required: true, in_list: true, in_filter: true}
    - {name: lessee, type: link, to: Customer, required: true, in_list: true, in_filter: true, label: Tenant}
    - {name: starts_on, type: date, required: true, in_list: true}
    - {name: ends_on, type: date, required: true, in_list: true}
    - {name: rent, type: currency, required: true, in_list: true, description: "A period's rent"}
    - {name: frequency, type: select, options: [Monthly, Quarterly, Yearly], default: Monthly, required: true, in_list: true}
    - {name: deposit, type: currency, min: "0", description: "Held through the books when the settings name a deposit account: owed by the lessee when the lease starts"}
    - {name: notice_days, type: int, default: 0, min: 0, label: Notice (Days), description: "Days of notice either side gives to end it before its end"}
    - {name: charges, type: table, of: LeaseCharge, label: Other Charges, description: "Invoiced with the rent each period"}
    - {name: rent_reviews, type: table, of: LeaseRentReview, label: Rent Reviews, description: "The rent from a day on, for the periods that start on or after it"}
    - {name: rent_index, type: link, to: RentIndex, label: Indexed To, description: "Each year from its start, the rent follows this index's rise since the year before (its latest value on or before each day), as a review"}
    - {name: index_cap, type: percent, min: "0", label: Most A Year, description: "The most an indexed rent rises in a year; no cap when empty"}
    - {name: index_floor, type: percent, min: "-100", label: Least A Year, description: "The least an indexed rent changes in a year; when empty, it never falls"}
    - {name: pays_service_charge, type: check, label: Pays Service Charge, description: "Its unit's share of its building's service charge budget is invoiced with its rent, by the budget's basis"}
    - {name: status, type: select, options: [Draft, Active, Ended, Terminated], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: next_invoice_on, type: date, read_only: true, no_copy: true, description: "The first day of the next period to invoice"}
    - {name: notice_given_on, type: date, read_only: true, no_copy: true}
    - {name: notice_by, type: select, options: [Lessee, Landlord], read_only: true, no_copy: true}
    - {name: leaving_on, type: date, label: Ends On Notice, read_only: true, no_copy: true, in_list: true, description: "Its last day, once the notice given runs out"}
    - {name: terminated_on, type: date, read_only: true, no_copy: true}
    - {name: deposit_entry, type: link, to: JournalEntry, read_only: true, no_copy: true, description: "The deposit owed and held"}
    - {name: deposit_return_entry, type: link, to: JournalEntry, read_only: true, no_copy: true, description: "The deposit given back, less what was kept"}
    - {name: deposit_kept, type: currency, read_only: true, no_copy: true}
    - {name: notes, type: text}
  actions:
    - {name: activate, label: Activate It, permission: write, condition: "doc.status == 'Draft'"}
    - {name: terminate, label: End It Early, permission: write, condition: "doc.status == 'Active'", params: [{name: date, type: date, label: Last Day, required: true, description: "From the lease's start to today, as both sides agree"}]}
    - {name: give_notice, label: Give Notice, permission: write, condition: "doc.status == 'Active'", params: [{name: date, type: date, label: Given On, required: true, description: "From the lease's start to today"}, {name: by, type: select, options: [Lessee, Landlord], required: true, label: Given By}]}
    - {name: review_rent, label: Review the Rent, permission: write, condition: "doc.status == 'Active'", params: [{name: date, type: date, label: From, required: true, description: "No sooner than the next period to invoice"}, {name: rent, type: currency, required: true, label: New Rent}, {name: note, type: data, label: Note}]}
    - {name: return_deposit, label: Return the Deposit, permission: write, condition: "doc.status == 'Ended' || doc.status == 'Terminated'", params: [{name: kept, type: currency, label: Kept, description: "For damage or rent owed; nothing when empty"}, {name: why, type: text, label: Why It Was Kept}]}
  numbering: {template: "LSE-{YYYY}-{seq:5}"}
  list: {columns: [number, unit, lessee, starts_on, ends_on, rent, status], sort: starts_on desc}

- name: LeaseRentReview
  label: Rent Review
  kind: child
  fields:
    - {name: effective_from, type: date, required: true, in_list: true, label: From}
    - {name: rent, type: currency, required: true, in_list: true}
    - {name: note, type: data, in_list: true}

- name: ServiceChargeBudget
  label: Service Charge Budget
  label_plural: Service Charge Budgets
  kind: master
  module: property
  title_field: building
  description: A building's shared costs for a year, shared among its units by its basis (floor area, equal shares, or floor area by each unit's weighting). The leases that pay service charge are invoiced their unit's share with their rent; once the year is over, the budget is reconciled against what was spent (read from the bills charged to its cost center), each lease invoiced or credited its share of the difference.
  fields:
    - {name: building, type: link, to: Building, required: true, in_list: true, in_filter: true}
    - {name: year_from, type: date, required: true, in_list: true, label: From}
    - {name: year_to, type: date, required: true, in_list: true, label: To}
    - {name: basis, type: select, options: [Floor Area, Equal Shares, Weighted Area], default: Floor Area, required: true, description: "How its costs are shared among the building's units"}
    - {name: cost_center, type: link, to: CostCenter, link_filters: {is_group: false}, label: Shared Costs In The Books, description: "What was spent is read from the submitted bills charged to it when the year is reconciled"}
    - {name: heads, type: table, of: ServiceChargeHead, label: Costs, description: "What it budgets for: cleaning, security, upkeep of the common parts"}
    - {name: budget, type: currency, read_only: true, no_copy: true, in_list: true, description: "Its costs' total"}
    - {name: status, type: select, options: [Draft, Active, Reconciled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: actual, type: currency, read_only: true, no_copy: true, label: Spent, description: "What the year's shared costs came to"}
    - {name: balances, type: table, of: ServiceChargeBalance, read_only: true, no_copy: true, description: "Each lease's share of the difference, and what was made for it"}
  unique: [[building, year_from]]
  list: {columns: [building, year_from, year_to, budget, status], sort: year_from desc}
  actions:
    - {name: activate_budget, label: Use It, permission: write, condition: "doc.status == 'Draft'"}
    - {name: reconcile, label: Reconcile, permission: write, condition: "doc.status == 'Active'", confirm: "Reconcile the year? Each lease is invoiced or credited its share of the difference.", params: [{name: actual, type: currency, label: Spent, description: "What the year's shared costs came to: read from the bills charged to its cost center when empty"}]}

- name: ServiceChargeHead
  label: Cost
  kind: child
  fields:
    - {name: head, type: data, required: true, in_list: true}
    - {name: amount, type: currency, required: true, min: "0", in_list: true}

- name: ServiceChargeBalance
  label: Balance
  kind: child
  fields:
    - {name: lease, type: link, to: Lease, in_list: true}
    - {name: days, type: int, in_list: true, description: "Its days within the year"}
    - {name: share, type: percent, in_list: true, description: "Its unit's share, by the budget's basis"}
    - {name: charged, type: currency, in_list: true}
    - {name: due, type: currency, in_list: true}
    - {name: difference, type: currency, in_list: true}
    - {name: document, type: link, to: SalesInvoice, in_list: true, description: "The invoice or credit note made for it"}
    - {name: note, type: data}

- name: RentIndex
  label: Rent Index
  label_plural: Rent Indexes
  kind: master
  module: property
  title_field: index_name
  description: A published index rents follow, such as a consumer price index, with its value from each month on.
  fields:
    - {name: index_name, type: data, required: true, unique: true, in_list: true}
    - {name: values, type: table, of: RentIndexValue, description: "Its value from each day on, as published"}
  list: {columns: [index_name], sort: index_name asc}

- name: RentIndexValue
  label: Index Value
  kind: child
  fields:
    - {name: month, type: date, required: true, in_list: true, label: From, description: "The first day it holds for"}
    - {name: value, type: decimal, required: true, min: "0", in_list: true}

- name: LeaseCharge
  label: Charge
  kind: child
  fields:
    - {name: charge, type: data, required: true, in_list: true}
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: amount, type: currency, required: true, in_list: true}

- name: RentInvoice
  label: Rent Invoice
  label_plural: Rent Invoices
  kind: master
  module: property
  title_field: lease
  description: One period of a lease, invoiced once; the days after the lease's last day given back when it ends sooner.
  fields:
    - {name: lease, type: link, to: Lease, required: true, read_only: true, in_list: true, in_filter: true}
    - {name: period_from, type: date, required: true, read_only: true, in_list: true}
    - {name: period_to, type: date, required: true, read_only: true, in_list: true}
    - {name: amount, type: currency, read_only: true, in_list: true}
    - {name: sales_invoice, type: link, to: SalesInvoice, read_only: true}
    - {name: late_fee_invoice, type: link, to: SalesInvoice, read_only: true, no_copy: true, description: "The fee charged when it was paid late"}
    - {name: billed_to, type: date, read_only: true, no_copy: true, label: Billed Until, description: "The last day it is billed for, once the days after the lease's last day were given back"}
    - {name: credit_note, type: link, to: SalesInvoice, read_only: true, no_copy: true, description: "What gave back the days after the lease's last day"}
  list: {columns: [lease, period_from, period_to, amount], sort: period_from desc}

- name: Inspection
  label: Inspection
  label_plural: Inspections
  kind: master
  module: property
  title_field: unit
  fields:
    - {name: unit, type: link, to: Unit, required: true, in_list: true, in_filter: true}
    - {name: lease, type: link, to: Lease}
    - {name: kind, type: select, options: [Move In, Move Out, Routine], default: Routine, required: true, in_list: true, in_filter: true}
    - {name: date, type: date, required: true, in_list: true}
    - {name: inspector, type: data}
    - {name: status, type: select, options: [Scheduled, Done], default: Scheduled, in_list: true, in_filter: true}
    - {name: findings, type: table, of: InspectionFinding}
  list: {columns: [unit, kind, date, status], sort: date desc}

- name: InspectionFinding
  label: Finding
  kind: child
  fields:
    - {name: area, type: data, required: true, in_list: true}
    - {name: condition, type: select, options: [Good, Fair, Poor, Damaged], default: Good, required: true, in_list: true}
    - {name: note, type: data, in_list: true}

- name: RepairRequest
  label: Repair Request
  label_plural: Repair Requests
  kind: master
  module: property
  title_field: summary
  description: Something to fix. An urgent one takes its unit out of service until it is done.
  fields:
    - {name: unit, type: link, to: Unit, required: true, in_list: true, in_filter: true}
    - {name: summary, type: data, required: true, in_list: true}
    - {name: details, type: text}
    - {name: priority, type: select, options: [Low, Normal, Urgent], default: Normal, in_list: true, in_filter: true}
    - {name: status, type: select, options: [Open, In Progress, Done], default: Open, in_list: true, in_filter: true}
    - {name: assigned_to, type: data}
    - {name: reported_by, type: email, read_only: true, no_copy: true, in_filter: true, description: "The lessee who asked for it on the portal"}
    - {name: done_on, type: date, read_only: true, no_copy: true}
    - {name: cost, type: currency, min: "0", description: "What it cost: charged to the building's owner on their statement for the days it was done in, unless it names its bill"}
    - {name: purchase_invoice, type: link, to: PurchaseInvoice, label: Bill, description: "The contractor's bill in ERP: once submitted, the owner is charged it (on the statement for the days it was posted) rather than the cost typed here"}
  numbering: {template: "MR-{YYYY}-{seq:5}"}
  list: {columns: [number, unit, summary, priority, status], sort: created_at desc}

- name: OwnerStatementExpense
  label: Expense
  kind: child
  fields:
    - {name: description, type: data, required: true, in_list: true}
    - {name: amount, type: currency, required: true, in_list: true}
    - {name: repair, type: link, to: RepairRequest, read_only: true, in_list: true, description: "The repair it was charged for"}
    - {name: purchase_invoice, type: link, to: PurchaseInvoice, read_only: true, in_list: true, label: Bill, description: "The bill in ERP it was charged for"}

- name: OwnerStatement
  label: Owner Statement
  label_plural: Owner Statements
  kind: master
  module: property
  title_field: building
  description: "What a building's owner is owed for some days. The rent, charges and fees collected on its rent invoices for periods starting then, less the management fee and the expenses charged to them, each once: the bills in ERP charged to the building, submitted and posted then; the repairs done then (at their bill, or the cost typed on them); and any added by hand. Billed, the payout is the owner's purchase invoice to the company, paid as ERP pays bills."
  fields:
    - {name: building, type: link, to: Building, required: true, in_list: true, in_filter: true}
    - {name: period_from, type: date, required: true, in_list: true}
    - {name: period_to, type: date, required: true, in_list: true}
    - {name: collected, type: currency, read_only: true, no_copy: true, in_list: true, description: "Paid on the rent invoices (and their late fees and credit notes) for periods starting in these days, by today"}
    - {name: fee_percent, type: percent, read_only: true, no_copy: true, label: Management Fee %}
    - {name: management_fee, type: currency, read_only: true, no_copy: true}
    - {name: expenses, type: table, of: OwnerStatementExpense, description: "The bills in ERP charged to the building and posted in these days, and the repairs done then, come by themselves, each once; add others by hand"}
    - {name: expenses_total, type: currency, read_only: true, no_copy: true, label: Expenses}
    - {name: payout, type: currency, read_only: true, no_copy: true, in_list: true, description: "Collected, less the fee and the expenses"}
    - {name: status, type: select, options: [Draft, Billed], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: purchase_invoice, type: link, to: PurchaseInvoice, read_only: true, no_copy: true, label: Billed By}
  actions:
    - {name: bill_owner, label: Bill The Payout, permission: write, condition: "doc.status == 'Draft'", confirm: "The owner's share is billed to the company as a purchase invoice, and this statement is kept as it is."}
  numbering: {template: "OS-{YYYY}-{seq:5}"}
  list: {columns: [number, building, period_from, period_to, collected, payout, status], sort: period_from desc}
