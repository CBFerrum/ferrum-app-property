id: property
name: Property
version: 0.7.1
publisher: cbferrum
summary: "Buildings and units, leases invoiced each period through ERP, rent reviews, notice, late fees and deposits through the books, repairs and inspections, and portal pages for lessees and owners"
description: README.md
categories: [industry, finance]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-property
support: https://github.com/CBFerrum/ferrum-app-property/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Records of ERP (customers, items, invoices): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [property]
uninstall: ask
# Its own interface at /property/: the units by building, leases ending soon and open requests.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: property
      route: property
      title: Property
      description: Units, leases, rent and maintenance
      icon: building-2
      color: "#0f766e"
      roles: [Property Manager, Facilities]
  shell.open:
    - {id: property, package: property, path: "property/e/{entity}/{id}", list: "property/e/{entity}"}
  shell.create:
    - {id: lease, label: Lease, path: property/e/Lease/new, entity: Lease}
    - {id: request, label: Repair Request, path: property/e/RepairRequest/new, entity: RepairRequest}
  # The workspace's portal (the property package's endpoints): a lessee's leases, rent invoiced and
  # repairs at /portal/home/; an owner's buildings, units, leases, rent and repairs at /portal/owner/.
  shell.portal:
    - {id: home, title: Your home, description: "Your lease, the rent invoiced and repairs you asked for"}
    - {id: owner, title: Properties you own, description: "For owners: units, leases, the rent invoiced and still owed, and repairs"}
